<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InkScreen Studio · 通用墨水屏界面编辑器</title>
<meta name="description" content="InkScreen 墨水屏摆件与通用界面编辑工具。">
</head>
<body>
<p>正在打开 <a href="./tools/inkscreen-studio/">InkScreen Studio 通用墨水屏界面编辑器</a>…</p>
<p><a href="https://github.com/liziyaaa/Inkscreen#readme">查看墨水屏摆件与项目说明</a></p>
<script>
(async () => {
  // Retire only this project's former root worker. Local editor data stays intact.
  if ("serviceWorker" in navigator) {
    try {
      const rootScope = new URL("./", location.href).href;
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r => r.scope === rootScope).map(r => r.unregister()));
    } catch (_) {}
  }
})().finally(() => {
  const target = new URL("./tools/inkscreen-studio/", location.href);
  target.search = location.search;
  target.hash = location.hash;
  location.replace(target.href);
});
</script>
</body>
</html>
